# ขึ้นเว็บ GitHub Pages: รันเทสต์ก่อน แล้วอัปโหลด "เฉพาะโฟลเดอร์ app/"
# ไฟล์อื่นในรีโป (CLAUDE.md, knowledge/, scripts/, tests/ ...) ไม่ขึ้นเว็บ
# ต้องตั้งในรีโปก่อน 1 ครั้ง: Settings → Pages → Source: GitHub Actions
name: Deploy SEED to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # ใส่เลข commit ลงใน sw.js: ชื่อแคชใหม่ทุกครั้งที่ deploy มือถือจะได้ไฟล์ชุดใหม่
      - name: Stamp service worker build
        run: |
          sed -i "s/__SEED_BUILD__/${GITHUB_SHA::12}/" app/sw.js
          if grep -q "__SEED_BUILD__" app/sw.js; then echo "stamp failed"; exit 1; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
